<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Razones 💚</title>
<meta name="robots" content="noindex">

<style>
  /* Paleta fija: se ve igual aunque el celular esté en modo oscuro */
  :root {
    color-scheme: only light;
    --bg: #EBF5ED;
    --card: #FFFFFF;
    --g1: #2A5040;
    --g2: #45856A;
    --g3: #78B896;
    --g4: #C0DECA;
    --g5: #EAF5EE;
    --t1: #1C3A2C;
    --t2: #507260;
    --t3: #8AADA0;
    --shadow: 0 6px 32px rgba(42,80,64,0.12);
    --shadow-lg: 0 12px 48px rgba(42,80,64,0.18);
    --r: 18px;
    --rsm: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 36px 16px 56px;
    color: var(--t1);
    display: flex; flex-direction: column;
  }

  .wrap { max-width: 480px; margin: 0 auto; width: 100%; flex: 1; }

  /* ── Header ── */
  .header { text-align: center; margin-bottom: 30px; }
  .header-deco { font-size: 2.2rem; display: block; margin-bottom: 10px; }
  .header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 2rem; font-weight: normal;
    color: var(--g1); margin-bottom: 6px;
  }
  .header p { font-size: 0.85rem; color: var(--t3); letter-spacing: 0.02em; }

  /* ── Zona principal ── */
  .stage { margin-bottom: 22px; }

  .invite-card, .reason-card {
    background: var(--card);
    border-radius: var(--r);
    box-shadow: var(--shadow-lg);
    border: 1.5px solid var(--g4);
  }

  /* Estado inicial */
  .invite-card {
    padding: 44px 28px;
    text-align: center;
  }
  .invite-deco { font-size: 3rem; display: block; margin-bottom: 16px; }
  .invite-title {
    font-family: Georgia, serif; font-size: 1.35rem; font-weight: normal;
    color: var(--g1); margin-bottom: 10px;
  }
  .invite-sub {
    font-size: 0.84rem; color: var(--t3); line-height: 1.55;
  }

  /* Razón revelada */
  .reason-card {
    padding: 36px 30px 30px;
    text-align: center;
    position: relative; overflow: hidden;
    animation: reveal 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) both;
  }
  @keyframes reveal {
    from { opacity: 0; transform: scale(0.92) translateY(14px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .reason-card { animation: none; } }

  .reason-card::before {
    content: ''; position: absolute; top: -46px; right: -38px;
    width: 130px; height: 130px; border-radius: 50%;
    background: var(--g5);
  }

  .reason-num {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 46px; height: 46px; padding: 0 12px;
    border-radius: 50px;
    background: var(--g5); color: var(--g2);
    font-family: Georgia, serif; font-size: 1.15rem;
    margin-bottom: 20px;
  }

  .reason-title {
    position: relative;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.5rem; font-weight: normal; line-height: 1.3;
    color: var(--g1);
    margin-bottom: 14px;
    text-wrap: balance;
  }

  .reason-text {
    position: relative;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem; line-height: 1.68;
    color: var(--t2);
    text-wrap: pretty;
  }

  .reason-sign {
    position: relative;
    margin-top: 22px; font-size: 0.76rem; color: var(--t3);
  }

  /* ── Botón ── */
  .btn {
    width: 100%; background: var(--g2); color: #fff;
    border: none; border-radius: 50px; padding: 17px 24px;
    font-size: 1rem; font-weight: 600; font-family: inherit;
    cursor: pointer; letter-spacing: 0.01em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s, transform 0.12s;
    box-shadow: 0 4px 16px rgba(69,133,106,0.25);
  }
  .btn:hover { background: var(--g1); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: var(--g4); color: var(--t3); cursor: default; box-shadow: none; }

  .btn-soft {
    background: transparent; color: var(--g2);
    border: 1.5px solid var(--g4); box-shadow: none;
  }
  .btn-soft:hover { background: var(--g5); border-color: var(--g3); }

  /* ── Pie ── */
  .meter {
    margin-top: 26px; text-align: center;
    font-size: 0.74rem; color: var(--t3);
  }
  .meter-bar {
    height: 4px; background: var(--g4); border-radius: 2px;
    overflow: hidden; margin-top: 9px;
  }
  .meter-fill {
    height: 100%; background: var(--g3); border-radius: 2px;
    transition: width 0.7s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  .cycle-note {
    margin-top: 14px; text-align: center;
    font-size: 0.78rem; color: var(--g2);
    background: var(--g5); border-radius: var(--rsm);
    padding: 10px 14px; display: none;
  }

  .foot {
    text-align: center; margin-top: 34px;
    font-size: 0.76rem;
  }
  .foot a { color: var(--t3); text-decoration: none; border-bottom: 1px solid var(--g4); padding-bottom: 1px; }
  .foot a:hover { color: var(--g2); }
</style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <span class="header-deco">💚</span>
    <h1>100 Razones</h1>
    <p>por las que me gustas</p>
  </header>

  <div class="stage" id="stage"></div>

  <button class="btn" id="mainBtn" onclick="mostrarRazon()">
    Dame una razón 🌿
  </button>

  <div class="cycle-note" id="cycleNote"></div>

  <div class="meter" id="meter"></div>

  <div class="foot">
    <a href="/momentos/">Ir a 100 Momentos 🌿</a>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════════════
//  TUS 100 RAZONES
//  Cada una tiene un título corto y una descripción, así:
//    { titulo: `Tu carita`, texto: `Me encanta porque…` },
//  Deja null las que todavía no quieras escribir: no aparecerán.
// ══════════════════════════════════════════════════════════════════════
const RAZONES = [
  { titulo: `Tu noble corazón`, texto: `En tus ojos no veo rencores ni maldad, sino que amabilidad. Admiro tu empatía hacia los animales y también tu bondad hacia los niños. Eres una persona que realmente practica la religiosidad.` },
  { titulo: `Tus ojos claros`, texto: `Me gustan mucho tus ojos, sobre todo porque me dejan ver con claridad tus pupilas y todo lo que expresa tu mirada cuando me dices lo que sientes, cuando hacemos el amor, cuando te ríes o cuando simplemente nos quedamos mirándonos antes de dormir.` },
  { titulo: `Tu lengua`, texto: `Me gustan inmensamente tus besos, en mi boca, en mi cuello y en todo mi cuerpo.` },
  { titulo: `Tu interés por la lectura`, texto: `Me gusta que podamos prestarnos libros, leernos en las noches y comentar libros a partir del club de lectura.` },
  { titulo: `Tu resiliencia`, texto: `Admiro que a pesar de las dificultades puedas salir adelante. Si bien me preocupo de acompañarte, me gusta tener la confianza de que siempre encontrarás los caminos necesarios por ti misma para seguir avanzando.` },
  { titulo: `Tu suerte`, texto: `Me gusta que así como yo, te consideres una persona con suerte, a la cual se le abren puertas justo en el momento que las necesita.` },
  { titulo: `Tu humor`, texto: `Me gusta que nos de risa el humor negro y el shitposting. Aquello permite que nos compartamos buenos memes y/o reels.` },
  { titulo: `Tu comida`, texto: `Me gusta lo rico y diferente que cocinas cada plato. Me gusta que mezcles sabores nuevos, que todo sea vegetariano y que te quede rico tanto lo salado como lo dulce.` },
  { titulo: `Tu orden`, texto: `Me gusta que cuides tu espacio y que siempre esté brillando, es algo que debo aprender más de ti.` },
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
  null,
];

const TOTAL = RAZONES.length;

// ── Estado ────────────────────────────────────────────────────────────
function getVistas() {
  try { return JSON.parse(localStorage.getItem('razones_vistas') || '[]'); }
  catch (e) { return []; }
}

function setVistas(v) {
  localStorage.setItem('razones_vistas', JSON.stringify(v));
}

function getUltima() {
  const v = localStorage.getItem('razones_ultima');
  return v === null ? null : parseInt(v);
}

// Índices escritos que todavía no ha visto en esta vuelta
function disponibles(vistas) {
  return RAZONES
    .map((r, i) => (r !== null && !vistas.includes(i)) ? i : null)
    .filter(i => i !== null);
}

function escritas() {
  return RAZONES.filter(r => r !== null).length;
}

// ── Mostrar una razón al azar ─────────────────────────────────────────
function mostrarRazon() {
  if (escritas() === 0) return;

  let vistas = getVistas();
  let pool   = disponibles(vistas);
  const nota = document.getElementById('cycleNote');

  // Ya las vio todas: se reinicia la vuelta para que nunca quede sin nada
  if (pool.length === 0) {
    vistas = [];
    pool   = disponibles(vistas);
    nota.textContent = 'Ya las viste todas una vez. Empecemos de nuevo 🌿';
    nota.style.display = 'block';
  } else {
    nota.style.display = 'none';
  }

  const idx = pool[Math.floor(Math.random() * pool.length)];
  vistas.push(idx);
  setVistas(vistas);
  localStorage.setItem('razones_ultima', idx);

  pintarRazon(idx);
  document.getElementById('mainBtn').innerHTML = 'Otra razón 💚';
  pintarMedidor();
}

// Acepta tanto { titulo, texto } como un texto suelto
function normalizar(r) {
  if (r === null || r === undefined) return null;
  return typeof r === 'string' ? { titulo: '', texto: r } : r;
}

function pintarRazon(idx) {
  const r = normalizar(RAZONES[idx]);
  document.getElementById('stage').innerHTML = `
    <div class="reason-card">
      <div class="reason-num">N.º ${idx + 1}</div>
      ${r.titulo ? `<h2 class="reason-title">${r.titulo}</h2>` : ''}
      ${r.texto  ? `<p class="reason-text">${r.texto}</p>` : ''}
      <div class="reason-sign">— y me faltan páginas 💚</div>
    </div>`;
}

function pintarInvitacion() {
  const hay = escritas() > 0;
  document.getElementById('stage').innerHTML = `
    <div class="invite-card">
      <span class="invite-deco">${hay ? '💌' : '🌱'}</span>
      <h2 class="invite-title">${hay ? 'Cuando lo necesites' : 'Todavía no hay razones'}</h2>
      <p class="invite-sub">${hay
        ? 'Toca el botón y aparece una razón,<br>al azar, de las que escribí para ti.'
        : 'Pronto vas a encontrar acá<br>las razones por las que me gustas.'}</p>
    </div>`;

  const btn = document.getElementById('mainBtn');
  btn.disabled = !hay;
  if (!hay) btn.textContent = 'Pronto 🌿';
}

function pintarMedidor() {
  const total = escritas();
  const medidor = document.getElementById('meter');
  if (total === 0) { medidor.innerHTML = ''; return; }

  const vistas = [...new Set(getVistas())].length;
  const pct    = Math.round((vistas / TOTAL) * 100);
  medidor.innerHTML = `
    ${vistas} de ${TOTAL} descubiertas
    <div class="meter-bar"><div class="meter-fill" style="width:${pct}%"></div></div>`;
}

// ── Init ──────────────────────────────────────────────────────────────
(function init() {
  const ultima = getUltima();
  // Si ya vio alguna, al volver le mostramos la última en vez del botón pelado
  if (ultima !== null && RAZONES[ultima]) {
    pintarRazon(ultima);
    document.getElementById('mainBtn').innerHTML = 'Otra razón 💚';
  } else {
    pintarInvitacion();
  }
  pintarMedidor();
})();
</script>
</body>
</html>
