<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fichas de compromiso · Global Shapers</title>
<meta name="robots" content="noindex">
<meta name="description" content="Saca una ficha al azar y elige una acción simple para los próximos 30 días.">
<meta name="theme-color" content="#FDFBEF">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: only light;
    --crema:    #FDFBEF;
    --tinta:    #14432E;
    --tinta-2:  #3C6152;
    --tinta-3:  #7A9589;

    --verde:    #E7F2DF;
    --verde-b:  #C3DEB4;
    --amarillo: #FDF2D4;
    --amar-b:   #F3DC9B;
    --azul:     #DDEAF6;
    --azul-b:   #B5D0E8;

    --sol:      #F4C340;
    --hoja:     #4A9D5F;

    --sombra:   0 6px 28px rgba(20,67,46,.10);
    --r:        22px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--crema);
    font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--tinta);
    min-height: 100vh;
    padding: 34px 18px calc(42px + env(safe-area-inset-bottom));
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { width: 100%; max-width: 480px; }

  /* ── Encabezado ── */
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 {
    font-size: 2.1rem; font-weight: 700; line-height: 1.1;
    letter-spacing: -.01em; margin-bottom: 11px;
  }
  .subtitulo {
    display: inline-block;
    background: var(--amar-b); color: var(--tinta);
    font-size: .92rem; font-weight: 600;
    padding: 6px 17px; border-radius: 50px;
  }

  /* ── Instrucción ── */
  .intro {
    background: var(--azul);
    border-radius: 15px;
    padding: 15px 18px;
    margin: 18px 0 22px;
    font-size: .88rem; font-weight: 400; line-height: 1.55;
    color: var(--tinta-2); text-align: center;
  }
  .intro b { font-weight: 600; color: var(--tinta); }

  /* ── Zona de la ficha ── */
  .escenario { min-height: 310px; display: flex; flex-direction: column; justify-content: center; }

  .invitacion { text-align: center; padding: 22px 0; }
  .invitacion .mazo {
    font-size: 3.3rem; display: block; margin-bottom: 14px;
    animation: respirar 3.5s ease-in-out infinite;
  }
  @keyframes respirar {
    0%, 100% { transform: translateY(0)    rotate(-3deg); }
    50%      { transform: translateY(-7px) rotate(3deg); }
  }
  .invitacion p {
    font-size: .92rem; color: var(--tinta-3); margin-bottom: 20px; font-weight: 400;
  }

  /* ── La tarjeta ── */
  .ficha {
    border-radius: var(--r);
    padding: 26px 24px 28px;
    text-align: center;
    box-shadow: var(--sombra);
    animation: aparecer .45s cubic-bezier(.22,1,.36,1) both;
  }
  .ficha.verde    { background: var(--verde);    border: 2px solid var(--verde-b); }
  .ficha.amarillo { background: var(--amarillo); border: 2px solid var(--amar-b); }
  .ficha.azul     { background: var(--azul);     border: 2px solid var(--azul-b); }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(16px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ficha, .invitacion .mazo { animation: none; }
  }

  /* El emoji con los rayitos amarillos del diseño original */
  .icono {
    position: relative; display: inline-block;
    font-size: 2.9rem; line-height: 1;
    margin-bottom: 15px;
  }
  .icono::before, .icono::after {
    content: ''; position: absolute; top: 50%;
    width: 13px; height: 3.5px; border-radius: 2px;
    background: var(--sol);
  }
  .icono::before { left: -21px;  transform: translateY(-50%) rotate(-24deg); }
  .icono::after  { right: -21px; transform: translateY(-50%) rotate(24deg); }

  .ficha h2 {
    font-size: 1.42rem; font-weight: 600; line-height: 1.2;
    margin-bottom: 9px;
  }
  .ficha p {
    font-size: .98rem; font-weight: 400; line-height: 1.55;
    color: var(--tinta-2);
  }

  .plazo {
    display: inline-block; margin-top: 16px;
    background: rgba(255,255,255,.75);
    border-radius: 50px; padding: 5px 14px;
    font-size: .76rem; font-weight: 600; color: var(--tinta-2);
  }

  /* ── Botones ── */
  .acciones { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

  .btn {
    font-family: inherit; font-size: 1rem; font-weight: 600;
    border-radius: 50px; padding: 14px 22px;
    cursor: pointer; border: 2px solid transparent;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s, background .2s, border-color .2s;
  }
  .btn:active { transform: scale(.975); }

  .btn-sol {
    background: var(--sol); color: var(--tinta);
    box-shadow: 0 4px 16px rgba(244,195,64,.4);
  }
  .btn-sol:hover { background: #F0B92A; }

  .btn-hoja { background: var(--hoja); color: #fff; }
  .btn-hoja:hover { background: #3E8A51; }

  .btn-suave {
    background: transparent; color: var(--tinta-2);
    border-color: var(--verde-b);
  }
  .btn-suave:hover { background: #F2F7EC; border-color: var(--hoja); }

  .quedan {
    text-align: center; margin-top: 14px;
    font-size: .78rem; color: var(--tinta-3); font-weight: 400;
  }

  /* ── Compromiso tomado ── */
  .sello {
    text-align: center; margin-bottom: 15px;
    font-size: .78rem; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--hoja);
  }

  .cierre {
    margin-top: 26px;
    background: var(--verde);
    border-radius: 15px; padding: 14px 18px;
    text-align: center; font-size: .85rem; font-weight: 400;
    line-height: 1.5; color: var(--tinta-2);
  }

  .rehacer {
    display: block; margin: 16px auto 0;
    background: none; border: none; padding: 4px;
    font-family: inherit; font-size: .8rem; color: var(--tinta-3);
    text-decoration: underline; cursor: pointer;
  }
  .rehacer:hover { color: var(--tinta-2); }

  /* ── Pie ── */
  .pie {
    margin-top: 30px; text-align: center;
    font-size: .76rem; font-weight: 400; color: var(--tinta-3);
  }
  .pie .hojita { color: var(--hoja); }
</style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <h1>Fichas de compromiso</h1>
    <span class="subtitulo">15 desafíos para un futuro posible</span>
  </header>

  <p class="intro">
    Saca una ficha al azar. Puedes aceptarla, cambiarla o sacar otra.<br>
    La idea es elegir una acción simple para los próximos <b>30 días</b>.
  </p>

  <main class="escenario" id="escenario"></main>

  <p class="pie"><span class="hojita">&#127807;</span> Global Shapers</p>

</div>

<script src="fichas.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════
//  Estado: qué fichas ya vio y cuál se terminó llevando.
//  Vive en el navegador de cada persona, así que en una junta cada quien
//  saca la suya sin pisarse con el resto.
// ══════════════════════════════════════════════════════════════════════
const CLAVE_VISTAS = 'fichas_vistas';
const CLAVE_MIA    = 'fichas_elegida';

function leer(clave, porDefecto) {
  try {
    const v = localStorage.getItem(clave);
    return v === null ? porDefecto : JSON.parse(v);
  } catch (e) { return porDefecto; }
}

function guardar(clave, valor) {
  try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) {}
}

function olvidar(clave) {
  try { localStorage.removeItem(clave); } catch (e) {}
}

// ── Sacar una al azar, sin repetir hasta haberlas visto todas ─────────
let actual = null;

function sacarFicha() {
  let vistas = leer(CLAVE_VISTAS, []);
  let quedan = FICHAS.map((f, i) => i).filter(i => !vistas.includes(i));

  // Las vio todas: se empieza otra vuelta para no dejarla sin ficha
  if (quedan.length === 0) {
    vistas = actual === null ? [] : [actual];
    quedan = FICHAS.map((f, i) => i).filter(i => !vistas.includes(i));
  }

  actual = quedan[Math.floor(Math.random() * quedan.length)];
  vistas.push(actual);
  guardar(CLAVE_VISTAS, vistas);

  pintarFicha(actual);
}

// ── Pintado ──────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function tarjetaHtml(f, conPlazo) {
  return `
    <div class="ficha ${f.tono}">
      <span class="icono">${f.emoji}</span>
      <h2>${esc(f.titulo)}</h2>
      <p>${esc(f.texto)}</p>
      ${conPlazo ? `<span class="plazo">Próximos 30 días</span>` : ''}
    </div>`;
}

function pintarInvitacion() {
  document.getElementById('escenario').innerHTML = `
    <div class="invitacion">
      <span class="mazo">&#127807;</span>
      <p>Quince acciones pequeñas.<br>Una es la tuya.</p>
      <button class="btn btn-sol" onclick="sacarFicha()">Sacar una ficha</button>
    </div>`;
}

function pintarFicha(i) {
  const f      = FICHAS[i];
  const vistas = leer(CLAVE_VISTAS, []).length;
  const faltan = FICHAS.length - vistas;

  document.getElementById('escenario').innerHTML = `
    ${tarjetaHtml(f, false)}
    <div class="acciones">
      <button class="btn btn-hoja" onclick="aceptarFicha()">Me comprometo</button>
      <button class="btn btn-suave" onclick="sacarFicha()">Sacar otra</button>
    </div>
    ${faltan > 0 ? `<p class="quedan">Quedan ${faltan} fichas por conocer</p>` : ''}`;
}

function aceptarFicha() {
  if (actual === null) return;
  guardar(CLAVE_MIA, actual);
  pintarCompromiso(actual);
}

function pintarCompromiso(i) {
  actual = i;
  document.getElementById('escenario').innerHTML = `
    <p class="sello">Tu compromiso</p>
    ${tarjetaHtml(FICHAS[i], true)}
    <div class="cierre">
      Si quieres, en la próxima junta puedes contar cómo te fue.
    </div>
    <button class="rehacer" onclick="empezarDeNuevo()">Prefiero otra ficha</button>`;
}

function empezarDeNuevo() {
  olvidar(CLAVE_MIA);
  sacarFicha();
}

// ── Arranque ─────────────────────────────────────────────────────────
(function init() {
  const mia = leer(CLAVE_MIA, null);
  // Si ya se comprometió, al volver encuentra su ficha, no el mazo
  if (mia !== null && FICHAS[mia]) pintarCompromiso(mia);
  else pintarInvitacion();
})();
</script>
</body>
</html>
