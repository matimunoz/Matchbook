<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nuestra línea de tiempo 🕰️</title>
<meta name="robots" content="noindex">

<style>
  :root {
    color-scheme: only light;
    --bg: #EBF5ED; --card: #FFFFFF;
    --g1: #2A5040; --g2: #45856A; --g3: #78B896; --g4: #C0DECA; --g5: #EAF5EE;
    --t1: #1C3A2C; --t2: #466355; --t3: #8AADA0;
    --shadow: 0 6px 32px rgba(42,80,64,.12);
    --r: 18px; --rsm: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh; color: var(--t1);
    padding: 30px 16px calc(60px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  /* ── Encabezado ── */
  .header { text-align: center; margin-bottom: 20px; }
  .header-deco { font-size: 1.9rem; display: block; margin-bottom: 8px; }
  .header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.8rem; font-weight: normal; color: var(--g1); margin-bottom: 5px;
  }
  .header p { font-size: .82rem; color: var(--t3); }

  .resumen {
    background: linear-gradient(145deg, var(--g1) 0%, var(--g2) 130%);
    color: #fff; border-radius: var(--r);
    padding: 18px 22px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: var(--shadow);
  }
  .r-num { font-family: Georgia, serif; font-size: 2rem; line-height: 1; display: block; }
  .r-lab { font-size: .63rem; letter-spacing: .09em; text-transform: uppercase; opacity: .8; margin-top: 4px; display: block; }
  .r-sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.22); }
  .r-txt { flex: 1; min-width: 0; font-size: .79rem; line-height: 1.5; opacity: .92; }
  .r-txt b { font-weight: 600; }

  /* ── Navegador de meses ── */
  .meses {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 6px; overflow-x: auto;
    padding: 10px 2px; margin: 0 -16px 6px; padding-left: 16px; padding-right: 16px;
    background: linear-gradient(to bottom, var(--bg) 70%, transparent);
    scrollbar-width: none;
  }
  .meses::-webkit-scrollbar { display: none; }
  .mes {
    flex-shrink: 0; display: flex; align-items: center; gap: 5px;
    background: var(--card); border: 1.5px solid var(--g4);
    border-radius: 50px; padding: 6px 12px;
    font-size: .75rem; font-family: inherit; color: var(--t2);
    cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .2s, background .2s;
  }
  .mes:hover, .mes.activo { border-color: var(--g3); background: var(--g5); color: var(--g1); }
  .mes b { font-weight: 600; }
  .mes .cuenta {
    background: var(--g5); color: var(--g2);
    border-radius: 50px; padding: 1px 6px; font-size: .66rem; font-weight: 700;
  }
  .mes.activo .cuenta { background: var(--g3); color: #fff; }

  /* ── Línea ── */
  .linea { position: relative; padding-left: 26px; }
  .linea::before {
    content: ''; position: absolute; left: 5px; top: 10px; bottom: 10px;
    width: 2px; background: var(--g4); border-radius: 1px;
  }

  .mes-sep {
    position: relative; margin: 22px 0 12px -26px;
    font-family: Georgia, serif; font-size: 1.1rem; color: var(--t3);
    display: flex; align-items: center; gap: 10px;
  }
  .mes-sep::after { content:''; flex:1; height:1px; background: var(--g4); }
  .mes-sep:first-child { margin-top: 4px; }

  /* Entrada normal: compacta, con un asomo del recuerdo */
  .ent { position: relative; margin-bottom: 9px; }
  .ent::before {
    content: ''; position: absolute; left: -26px; top: 15px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--card); border: 2.5px solid var(--g4);
  }
  .ent-card {
    background: var(--card); border-radius: var(--rsm);
    border: 1.5px solid var(--g4); padding: 12px 14px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: border-color .2s;
  }
  .ent-card:active { background: var(--g5); }
  .ent.abierta .ent-card { border-color: var(--g3); }
  .ent.abierta::before { border-color: var(--g3); }

  .ent-fecha {
    font-size: .66rem; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--g2); margin-bottom: 5px;
  }
  .ent-texto {
    font-family: Georgia, serif; font-size: .9rem; line-height: 1.6; color: var(--t2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ent.abierta .ent-texto { -webkit-line-clamp: unset; color: var(--t1); }

  /* Hito: tarjeta entera, con peso */
  .hito { position: relative; margin: 16px 0; }
  .hito::before {
    content: ''; position: absolute; left: -26px; top: 18px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--g1); border: 2.5px solid var(--g1);
    box-shadow: 0 0 0 4px var(--bg);
  }
  .hito-card {
    background: var(--g5); border-radius: var(--r);
    border: 1.5px solid var(--g3); padding: 17px 19px;
    box-shadow: 0 2px 14px rgba(42,80,64,.08);
  }
  .hito-em { font-size: 1.5rem; display: block; margin-bottom: 7px; }
  .hito-fecha {
    font-size: .66rem; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--g2); margin-bottom: 4px;
  }
  .hito-tit {
    font-family: Georgia, serif; font-size: 1.22rem; color: var(--g1);
    line-height: 1.3; margin-bottom: 5px;
  }
  .hito-txt {
    font-size: .86rem; line-height: 1.6; color: var(--t2);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hito.abierta .hito-txt { -webkit-line-clamp: unset; color: var(--t1); }
  .hito-card { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .hito.futuro::before { background: var(--bg); border-style: dashed; border-color: var(--g4); }
  .hito.futuro .hito-card {
    background: transparent; border-style: dashed; border-color: var(--g4); box-shadow: none;
  }
  .hito.futuro .hito-tit, .hito.futuro .hito-fecha { color: var(--t3); }

  /* ── Botón flotante ── */
  .ir-hoy {
    position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom));
    z-index: 10; background: var(--g1); color: #fff; border: none;
    border-radius: 50px; padding: 11px 17px; font-size: .8rem; font-weight: 600;
    font-family: inherit; cursor: pointer; box-shadow: 0 6px 20px rgba(42,80,64,.3);
    display: none; align-items: center; gap: 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .ir-hoy.on { display: inline-flex; }

  .foot { margin-top: 28px; text-align: center; font-size: .76rem; }
  .foot a { color: var(--t3); text-decoration: none; border-bottom: 1px solid var(--g4); }
  .foot a:hover { color: var(--g2); }
</style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <span class="header-deco">🕰️</span>
    <h1>Nuestra línea de tiempo</h1>
    <p>cómo llegamos hasta acá</p>
  </header>

  <div class="resumen" id="resumen"></div>
  <div class="meses" id="meses"></div>
  <div class="linea" id="linea"></div>

  <div class="foot"><a href="/alyn/">Volver al inicio 💚</a></div>
</div>

<button class="ir-hoy" id="irHoy" onclick="irAlFinal()">↓ Lo más reciente</button>

<script src="/momentos/momentos.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════
//  FECHAS CLAVE
// ══════════════════════════════════════════════════════════════════════
const POLOLEO = '2026-08-13';

// ══════════════════════════════════════════════════════════════════════
//  HITOS que no son momentos. Se dibujan como tarjeta grande.
//  Si llevan "momento", se funden con ese recuerdo en vez de duplicarlo.
// ══════════════════════════════════════════════════════════════════════
const HITOS = [
  { fecha: '2025-12-20', em: '✨', titulo: `Nuestra primera cita`, momento: 19 },
  { fecha: '2026-07-08', em: '💚', titulo: `Te dije que te quería`, momento: 6 },
  { fecha: POLOLEO,      em: '🌿', titulo: `Te pedí pololeo` },
  { fecha: '2026-10-13', em: '💌', titulo: `Dos meses`,
    texto: `Hipnotizados por nuestros sueños.` },
  { fecha: '2026-11-13', em: '🗓️', titulo: `Tres meses`, futuro: true },
];

// ── Momentos ya descubiertos ─────────────────────────────────────────
function rango(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }
const DESCUBIERTOS = [...rango(1, 32), 36, 38];

// ══════════════════════════════════════════════════════════════════════
const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];
const CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS_SEM = 'lunes|martes|miércoles|jueves|viernes|sábado|domingo';

function fechaDe(texto) {
  const conDia = texto.match(new RegExp(`^\\s*Un[ao]?\\s+(?:(?:${DIAS_SEM})\\s+)?(\\d{1,2})\\s+de\\s+(\\p{L}+)`, 'iu'));
  if (conDia) {
    const mes = MESES.indexOf(conDia[2].toLowerCase());
    if (mes !== -1) return { iso: armar(mes, +conDia[1]), aprox: false };
  }
  const soloMes = texto.match(/\ben\s+(\p{L}+)/iu);
  if (soloMes) {
    const mes = MESES.indexOf(soloMes[1].toLowerCase());
    if (mes !== -1) return { iso: armar(mes, 15), aprox: true };
  }
  return null;
}

// La relación empezó en diciembre de 2025: diciembre es 2025, el resto 2026.
function armar(mes, dia) {
  const anio = mes === 11 ? 2025 : 2026;
  return `${anio}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}

// Se le quita la fecha al texto, que ya se muestra arriba
function sinFecha(texto) {
  const t = texto
    .replace(new RegExp(`^\\s*Un[ao]?\\s+(?:(?:${DIAS_SEM})\\s+)?\\d{1,2}\\s+de\\s+\\p{L}+,?\\s*`, 'iu'), '')
    .replace(/^\s*Varios días en \p{L}+,?\s*/iu, '')
    // La etiqueta ya dice que no se sabe el día; repetirlo sobra
    .replace(/^\s*No s[eé] (?:qu[eé]|que) d[ií]a fue (?:este|[eé]ste),?\s*(?:pero\s*)?/iu, '')
    .trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function formatear(iso, aprox) {
  const [y, m, d] = iso.split('-').map(Number);
  return aprox ? `${MESES[m-1]} de ${y}` : `${d} de ${MESES[m-1]}`;
}

function diasDesde(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const hoy = new Date();
  return Math.round(
    (Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()) - Date.UTC(y, m - 1, d)) / 86400000
  );
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ── Construcción ─────────────────────────────────────────────────────
// Nunca se muestran momentos sin descubrir: eso arruinaría 100 Momentos.
function vistos() {
  let enSuTelefono = [];
  try { enSuTelefono = JSON.parse(localStorage.getItem('momentos_seen') || '[]'); } catch (e) {}
  return new Set([...DESCUBIERTOS.map(n => n - 1), ...enSuTelefono]);
}

function construir() {
  const abiertos = vistos();
  const usadosPorHito = new Set(HITOS.filter(h => h.momento).map(h => h.momento - 1));
  const entradas = [];

  MOMENTOS.forEach((texto, i) => {
    if (texto === null || !abiertos.has(i) || usadosPorHito.has(i)) return;
    const f = fechaDe(texto);
    // Sin fecha no entra a la línea: no hay dónde ponerlo
    if (!f) return;
    entradas.push({ tipo: 'ent', fecha: f.iso, aprox: f.aprox, texto: sinFecha(texto) });
  });

  HITOS.forEach(h => {
    // Un hito con momento solo aparece si ella ya lo descubrió
    if (h.momento && !abiertos.has(h.momento - 1)) return;
    const texto = h.texto || (h.momento ? sinFecha(MOMENTOS[h.momento - 1]) : '');
    entradas.push({ tipo: 'hito', ...h, texto });
  });

  entradas.sort((a, b) => a.fecha.localeCompare(b.fecha));
  return entradas;
}

// ── Render ───────────────────────────────────────────────────────────
let ENTRADAS = [];

function pintar() {
  ENTRADAS = construir();
  pintarResumen();
  pintarMeses();
  pintarLinea();
}

function pintarResumen() {
  const recuerdos = ENTRADAS.filter(e => e.tipo === 'ent' || e.momento).length;
  // Solo cuentan los que sí pueden llegar algún día: los sin fecha nunca entran
  const conFecha  = MOMENTOS.filter(m => m !== null && fechaDe(m)).length;
  const faltan    = conFecha - recuerdos;

  document.getElementById('resumen').innerHTML = `
    <span>
      <span class="r-num">${recuerdos}</span>
      <span class="r-lab">recuerdos</span>
    </span>
    <span class="r-sep"></span>
    <span class="r-txt">
      ${diasDesde(POLOLEO)} días de pololeo, ${diasDesde('2025-12-20')} desde la primera cita.
      ${faltan > 0 ? `<br>Quedan <b>${faltan}</b> esperando su lugar 🌿` : ''}
    </span>`;
}

function clave(iso) { return iso.slice(0, 7); }

function pintarMeses() {
  const cuentas = new Map();
  ENTRADAS.forEach(e => {
    if (e.futuro) return;
    cuentas.set(clave(e.fecha), (cuentas.get(clave(e.fecha)) || 0) + 1);
  });

  document.getElementById('meses').innerHTML = [...cuentas.entries()].map(([k, n]) => {
    const [y, m] = k.split('-').map(Number);
    return `<button class="mes" data-mes="${k}" onclick="irAMes('${k}')">
      <b>${CORTOS[m-1]}</b>${m === 12 ? ` ${String(y).slice(2)}` : ''}
      <span class="cuenta">${n}</span>
    </button>`;
  }).join('');
}

function pintarLinea() {
  let mesActual = null, html = '';

  ENTRADAS.forEach((e, i) => {
    const k = clave(e.fecha);
    if (k !== mesActual) {
      mesActual = k;
      const [y, m] = k.split('-').map(Number);
      html += `<div class="mes-sep" id="m-${k}">${MESES[m-1]}${m === 12 ? ` ${y}` : ''}</div>`;
    }

    if (e.tipo === 'hito') {
      html += `
        <div class="hito ${e.futuro ? 'futuro' : ''}" id="e-${i}" onclick="abrir(${i})">
          <div class="hito-card">
            <span class="hito-em">${e.em || '🌿'}</span>
            <div class="hito-fecha">${formatear(e.fecha)}</div>
            <div class="hito-tit">${esc(e.titulo)}</div>
            ${e.texto ? `<div class="hito-txt">${esc(e.texto)}</div>` : ''}
          </div>
        </div>`;
    } else {
      html += `
        <div class="ent" id="e-${i}" onclick="abrir(${i})">
          <div class="ent-card">
            <div class="ent-fecha">${formatear(e.fecha, e.aprox)}</div>
            <div class="ent-texto">${esc(e.texto)}</div>
          </div>
        </div>`;
    }
  });

  document.getElementById('linea').innerHTML = html;
}

function abrir(i) {
  document.getElementById('e-' + i).classList.toggle('abierta');
}

// ── Navegación ───────────────────────────────────────────────────────
function irAMes(k) {
  const el = document.getElementById('m-' + k);
  if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - 74;  // bajo la barra pegada
  window.scrollTo({ top: y, behavior: 'smooth' });
}

function irAlFinal() {
  const hitos = document.querySelectorAll('.hito:not(.futuro), .ent');
  const ultimo = hitos[hitos.length - 1];
  if (ultimo) ultimo.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// El botón aparece solo si todavía queda camino hacia abajo
function vigilar() {
  const lejos = (document.body.scrollHeight - window.scrollY - window.innerHeight) > 600;
  document.getElementById('irHoy').classList.toggle('on', lejos);

  // Resalta el mes en que va
  let visible = null;
  document.querySelectorAll('.mes-sep').forEach(s => {
    if (s.getBoundingClientRect().top < 120) visible = s.id.slice(2);
  });
  document.querySelectorAll('.mes').forEach(b => {
    b.classList.toggle('activo', b.dataset.mes === visible);
  });
}

window.addEventListener('scroll', vigilar, { passive: true });

pintar();
vigilar();
</script>
</body>
</html>
