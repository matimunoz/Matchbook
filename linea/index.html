<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nuestra línea de tiempo 🕰️</title>
<meta name="robots" content="noindex">

<style>
  :root {
    color-scheme: only light;
    --bg: #EBF5ED; --card: #FFFFFF;
    --g1: #2A5040; --g2: #45856A; --g3: #78B896; --g4: #C0DECA; --g5: #EAF5EE;
    --t1: #1C3A2C; --t2: #466355; --t3: #8AADA0;
    --shadow: 0 6px 32px rgba(42,80,64,.12);
    --r: 18px; --rsm: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh; color: var(--t1);
    padding: 34px 16px calc(48px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 28px; }
  .header-deco { font-size: 2rem; display: block; margin-bottom: 10px; }
  .header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.9rem; font-weight: normal; color: var(--g1); margin-bottom: 6px;
  }
  .header p { font-size: .83rem; color: var(--t3); }

  /* ── Resumen ── */
  .resumen {
    background: linear-gradient(145deg, var(--g1) 0%, var(--g2) 130%);
    color: #fff; border-radius: var(--r);
    padding: 22px 20px; margin-bottom: 14px;
    display: flex; justify-content: space-around; text-align: center;
    box-shadow: var(--shadow);
  }
  .r-num { font-family: Georgia, serif; font-size: 1.7rem; line-height: 1.1; display: block; }
  .r-lab { font-size: .63rem; letter-spacing: .08em; text-transform: uppercase; opacity: .8; margin-top: 4px; display: block; }

  .nota {
    background: var(--g5); border: 1px dashed var(--g4); border-radius: var(--rsm);
    padding: 12px 15px; margin-bottom: 26px;
    font-size: .79rem; color: var(--t2); line-height: 1.5; text-align: center;
  }

  /* ── Línea ── */
  .linea { position: relative; padding-left: 30px; }
  .linea::before {
    content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px;
    width: 2px; background: var(--g4); border-radius: 1px;
  }

  .hito { position: relative; margin-bottom: 18px; }
  .hito::before {
    content: ''; position: absolute; left: -30px; top: 16px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--g3);
  }
  .hito.grande::before { border-color: var(--g1); background: var(--g1); }
  .hito.futuro::before { border-style: dashed; border-color: var(--g4); }

  .hito-card {
    background: var(--card); border-radius: var(--rsm);
    border: 1.5px solid var(--g4); padding: 14px 16px;
    box-shadow: 0 2px 10px rgba(42,80,64,.06);
  }
  .hito.grande .hito-card { border-color: var(--g3); background: var(--g5); }
  .hito.futuro .hito-card { border-style: dashed; background: transparent; box-shadow: none; }

  .hito-fecha {
    font-size: .67rem; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--g2); margin-bottom: 5px;
  }
  .hito.futuro .hito-fecha { color: var(--t3); }
  .hito-titulo {
    font-family: Georgia, serif; font-size: 1.04rem;
    color: var(--g1); line-height: 1.35; margin-bottom: 5px;
  }
  .hito-texto { font-size: .84rem; line-height: 1.6; color: var(--t2); }
  .hito-mas {
    background: none; border: none; padding: 0; margin-top: 6px;
    font-family: Georgia, serif; font-style: italic; font-size: .78rem;
    color: var(--g2); cursor: pointer; border-bottom: 1px solid var(--g4);
  }

  .anio {
    font-family: Georgia, serif; font-size: 1.45rem; color: var(--t3);
    margin: 28px 0 16px -30px; position: relative;
  }
  .anio:first-child { margin-top: 0; }

  .foot { margin-top: 32px; text-align: center; font-size: .76rem; }
  .foot a { color: var(--t3); text-decoration: none; border-bottom: 1px solid var(--g4); }
  .foot a:hover { color: var(--g2); }
</style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <span class="header-deco">🕰️</span>
    <h1>Nuestra línea de tiempo</h1>
    <p>cómo llegamos hasta acá</p>
  </header>

  <div class="resumen" id="resumen"></div>
  <div class="nota" id="nota"></div>
  <div class="linea" id="linea"></div>

  <div class="foot"><a href="/alyn/">Volver al inicio 💚</a></div>
</div>

<script src="/momentos/momentos.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════
//  FECHAS CLAVE
// ══════════════════════════════════════════════════════════════════════
const POLOLEO = '2026-08-13';   // ← ajústala si no fue ese día

// Momentos que Alyn ya descubrió, por número del admin.
// La página igual lee su teléfono: si ella abrió más, aparecen solos.
// Acá solo hace falta mantener lo mínimo para que se vea bien desde
// cualquier dispositivo.
const DESCUBIERTOS = [...rango(1, 32), 36, 38];
function rango(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }

// ══════════════════════════════════════════════════════════════════════
//  HITOS que no son momentos. Agrega los que quieras.
//  futuro: true los dibuja punteados, como algo que todavía no pasa.
// ══════════════════════════════════════════════════════════════════════
const HITOS = [
  { fecha: POLOLEO,      titulo: `Te pedí pololeo`, grande: true },
  { fecha: '2026-10-13', titulo: `Dos meses`, grande: true,
    texto: `Hipnotizados por nuestros sueños.` },
  { fecha: '2026-11-13', titulo: `Tres meses`, futuro: true },
];

// ══════════════════════════════════════════════════════════════════════
const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS_SEM = 'lunes|martes|miércoles|jueves|viernes|sábado|domingo';

// Los momentos traen la fecha dentro del texto: "Un 5 de agosto, …",
// "Un jueves 25 de junio, …", "Varios días en Marzo, …".
function fechaDe(texto) {
  const conDia = texto.match(new RegExp(`^\\s*Un[ao]?\\s+(?:(?:${DIAS_SEM})\\s+)?(\\d{1,2})\\s+de\\s+(\\p{L}+)`, 'iu'));
  if (conDia) {
    const mes = MESES.indexOf(conDia[2].toLowerCase());
    if (mes !== -1) return { iso: armar(mes, +conDia[1]), aprox: false };
  }
  const soloMes = texto.match(/\ben\s+(\p{L}+)/iu);
  if (soloMes) {
    const mes = MESES.indexOf(soloMes[1].toLowerCase());
    if (mes !== -1) return { iso: armar(mes, 15), aprox: true };
  }
  return null;
}

// La relación empezó en diciembre de 2025: diciembre es 2025, el resto 2026.
function armar(mes, dia) {
  const anio = mes === 11 ? 2025 : 2026;
  return `${anio}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}

// El titular es un asomo corto; el texto completo va detrás de "leer el recuerdo"
function titularDe(texto) {
  const sinFecha = texto
    .replace(new RegExp(`^\\s*Un[ao]?\\s+(?:(?:${DIAS_SEM})\\s+)?\\d{1,2}\\s+de\\s+\\p{L}+,?\\s*`, 'iu'), '')
    .replace(/^\s*Varios días en \p{L}+,?\s*/iu, '')
    .trim();

  const TOPE = 52;
  const corte = sinFecha.search(/[,.:;]/);
  let t, cortado = false;

  if (corte > 12 && corte <= TOPE) {
    t = sinFecha.slice(0, corte);
  } else {
    t = sinFecha.slice(0, TOPE);
    const esp = t.lastIndexOf(' ');
    if (esp > 22) t = t.slice(0, esp);
    cortado = sinFecha.length > t.length;
  }

  t = t.trim();
  return t.charAt(0).toUpperCase() + t.slice(1) + (cortado ? '…' : '');
}

function formatear(iso, aprox) {
  const [y, m, d] = iso.split('-').map(Number);
  return aprox ? `${MESES[m-1]} de ${y}` : `${d} de ${MESES[m-1]}, ${y}`;
}

function diasDesde(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const hoy = new Date();
  return Math.round(
    (Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()) - Date.UTC(y, m - 1, d)) / 86400000
  );
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ── Qué momentos mostrar ─────────────────────────────────────────────
// Nunca los que ella no ha abierto: eso arruinaría 100 Momentos.
function vistos() {
  const porConfig = DESCUBIERTOS.map(n => n - 1);
  let enSuTelefono = [];
  try { enSuTelefono = JSON.parse(localStorage.getItem('momentos_seen') || '[]'); } catch (e) {}
  return new Set([...porConfig, ...enSuTelefono]);
}

function construir() {
  const abiertos = vistos();
  const entradas = [];

  MOMENTOS.forEach((texto, i) => {
    if (texto === null || !abiertos.has(i)) return;
    const f = fechaDe(texto);
    if (!f) return;                     // los que no dicen fecha quedan fuera
    entradas.push({
      fecha: f.iso, aprox: f.aprox,
      titulo: titularDe(texto),
      texto, momento: i + 1
    });
  });

  HITOS.forEach(h => entradas.push({ ...h }));
  return entradas.sort((a, b) => a.fecha.localeCompare(b.fecha));
}

// ── Render ───────────────────────────────────────────────────────────
let ENTRADAS = [];

function pintar() {
  ENTRADAS = construir();
  const conMomento = ENTRADAS.filter(e => e.momento).length;
  const escritos = MOMENTOS.filter(m => m !== null).length;
  const primera = ENTRADAS.find(e => !e.futuro);

  document.getElementById('resumen').innerHTML = `
    <div>
      <span class="r-num">${primera ? diasDesde(primera.fecha) : 0}</span>
      <span class="r-lab">días desde<br>el principio</span>
    </div>
    <div>
      <span class="r-num">${diasDesde(POLOLEO)}</span>
      <span class="r-lab">días de<br>pololeo</span>
    </div>
    <div>
      <span class="r-num">${conMomento}</span>
      <span class="r-lab">recuerdos<br>en la línea</span>
    </div>`;

  const faltan = escritos - conMomento;
  document.getElementById('nota').innerHTML = faltan > 0
    ? `Esta línea crece sola: cada momento que descubras aparece acá.<br>Quedan <b>${faltan}</b> esperando su lugar 🌿`
    : `Están todos los momentos que has descubierto hasta hoy 🌿`;

  let anio = null, html = '';
  ENTRADAS.forEach((e, idx) => {
    const a = e.fecha.slice(0, 4);
    if (a !== anio) { anio = a; html += `<div class="anio">${a}</div>`; }
    const clases = ['hito', e.grande ? 'grande' : '', e.futuro ? 'futuro' : ''].join(' ');
    html += `
      <div class="${clases}">
        <div class="hito-card">
          <div class="hito-fecha">${formatear(e.fecha, e.aprox)}</div>
          <div class="hito-titulo">${esc(e.titulo)}</div>
          ${e.texto && !e.momento ? `<div class="hito-texto">${esc(e.texto)}</div>` : ''}
          ${e.momento ? `
            <div class="hito-texto" id="tx-${idx}" hidden>${esc(e.texto)}</div>
            <button class="hito-mas" id="bt-${idx}" onclick="verMas(${idx})">leer el recuerdo</button>` : ''}
        </div>
      </div>`;
  });
  document.getElementById('linea').innerHTML = html;
}

function verMas(idx) {
  const tx = document.getElementById('tx-' + idx);
  const bt = document.getElementById('bt-' + idx);
  tx.hidden = !tx.hidden;
  bt.textContent = tx.hidden ? 'leer el recuerdo' : 'cerrar';
}

pintar();
</script>
</body>
</html>
