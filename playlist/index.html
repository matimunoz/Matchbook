<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nuestra playlist 🎧</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EBF5ED">

<style>
  :root {
    color-scheme: only light;
    --bg: #EBF5ED; --card: #FFFFFF;
    --g1: #2A5040; --g2: #45856A; --g3: #78B896; --g4: #C0DECA; --g5: #EAF5EE;
    --t1: #1C3A2C; --t2: #466355; --t3: #8AADA0;
    --shadow: 0 6px 32px rgba(42,80,64,.12);
    --r: 18px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh; color: var(--t1);
    padding: 34px 16px calc(50px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  /* ── Encabezado ── */
  .header { text-align: center; margin-bottom: 24px; }
  .header-deco { font-size: 1.9rem; display: block; margin-bottom: 8px; }
  .header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.8rem; font-weight: normal; color: var(--g1); margin-bottom: 6px;
  }
  .header p { font-size: .82rem; color: var(--t3); line-height: 1.5; }

  /* ── Canción ── */
  .cancion {
    background: var(--card);
    border: 1.5px solid var(--g4);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    padding: 16px 17px 18px;
    margin-bottom: 13px;
    animation: subir .5s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes subir {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .cancion { animation: none; } }

  .cabecera { display: flex; align-items: center; gap: 14px; }

  .portada {
    width: 76px; height: 76px; flex-shrink: 0;
    border-radius: 11px; object-fit: cover;
    background: var(--g5);
    box-shadow: 0 3px 12px rgba(42,80,64,.18);
  }
  /* Si no hay portada o no carga, queda un disquito en su lugar */
  .sin-portada {
    width: 76px; height: 76px; flex-shrink: 0;
    border-radius: 11px; background: var(--g5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.7rem;
  }

  .titulos { min-width: 0; }
  .cancion h2 {
    font-family: Georgia, serif; font-size: 1.14rem; font-weight: normal;
    line-height: 1.25; color: var(--g1); margin-bottom: 3px;
  }
  .artista {
    font-size: .79rem; color: var(--t3); letter-spacing: .02em;
  }

  .porque {
    font-size: .89rem; line-height: 1.62; color: var(--t2);
    margin-top: 14px; padding-top: 13px;
    border-top: 1px solid var(--g4);
  }

  /* ── Reproductor ── */
  .player { margin-top: 13px; }

  .escuchar {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--g5); color: var(--g1);
    border: 1.5px solid var(--g4); border-radius: 50px;
    padding: 8px 16px 8px 13px;
    font-family: inherit; font-size: .81rem; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: border-color .2s, background .2s;
  }
  .escuchar:hover  { border-color: var(--g3); background: #E2F0E7; }
  .escuchar:active { transform: scale(.97); }
  .escuchar .tri { font-size: .68rem; color: var(--g2); }

  .player iframe {
    width: 100%; border: none; border-radius: 12px; display: block;
    animation: aparecer .35s ease both;
  }
  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .player iframe { animation: none; } }

  /* ── La playlist completa ── */
  .completa { margin-top: 30px; }
  .completa h2 {
    font-family: Georgia, serif; font-size: 1.3rem; font-weight: normal;
    color: var(--g1); text-align: center; margin-bottom: 6px;
  }
  .completa .nota {
    text-align: center; font-size: .8rem; color: var(--t3);
    line-height: 1.55; margin-bottom: 15px;
  }
  .completa iframe {
    width: 100%; border: none; border-radius: var(--r); display: block;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <span class="header-deco">🎧</span>
    <h1>Nuestra playlist</h1>
    <p>y por qué cada una de esas canciones son tan nuestras</p>
  </header>

  <main id="lista"></main>

  <section class="completa">
    <h2>Y las demás</h2>
    <p class="nota" id="nota"></p>
    <div id="playlistEntera"></div>
  </section>

  <div class="foot-amor">te amo 💚</div>

</div>

<script src="canciones.js"></script>
<script>
// Del enlace de Spotify solo se necesita el identificador. Se acepta el
// enlace completo tal como lo copia la app, con todo lo que trae pegado.
function idDeSpotify(enlace) {
  if (!enlace) return '';
  const m = String(enlace).match(/track[/:]([A-Za-z0-9]+)/);
  return m ? m[1] : String(enlace).trim();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// El reproductor no se carga hasta que ella lo pide: seis iframes de
// entrada harían lenta la página en el teléfono.
function escuchar(i) {
  const id = idDeSpotify(CANCIONES[i].spotify);
  if (!id) return;
  document.getElementById('player-' + i).innerHTML =
    `<iframe src="https://open.spotify.com/embed/track/${id}"
             height="152" loading="lazy"
             allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
             title="Reproductor de ${esc(CANCIONES[i].titulo)}"></iframe>`;
}

// Si la portada no carga, la reemplaza un disquito en vez de dejar un hueco
function portadaRota(img) {
  const hueco = document.createElement('span');
  hueco.className = 'sin-portada';
  hueco.textContent = '💿';
  img.replaceWith(hueco);
}

document.getElementById('lista').innerHTML = CANCIONES.map((c, i) => `
  <article class="cancion" style="animation-delay:${(i * .06).toFixed(2)}s">
    <div class="cabecera">
      ${c.portada
        ? `<img class="portada" src="${esc(c.portada)}" alt="Portada de ${esc(c.titulo)}"
                loading="lazy" onerror="portadaRota(this)">`
        : `<span class="sin-portada">💿</span>`}
      <div class="titulos">
        <h2>${esc(c.titulo)}</h2>
        <div class="artista">${esc(c.artista)}</div>
      </div>
    </div>
    <p class="porque">${esc(c.texto)}</p>
    ${c.spotify ? `
      <div class="player" id="player-${i}">
        <button class="escuchar" onclick="escuchar(${i})">
          <span class="tri">&#9654;</span> Escuchar
        </button>
      </div>` : ''}
  </article>`).join('');

// La playlist entera, para las que todavía no tienen su historia
document.getElementById('nota').textContent =
  `Las ${CANCIONES.length} de arriba ya tienen su porqué. Acá está la playlist completa.`;

document.getElementById('playlistEntera').innerHTML =
  `<iframe src="https://open.spotify.com/embed/playlist/${PLAYLIST}"
           height="420" loading="lazy"
           allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
           title="Nuestra playlist completa"></iframe>`;
</script>
<script src="/alyn/volver.js"></script>
</body>
</html>
