<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Momentos 🌿</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
  /* Paleta fija: la página se ve igual aunque el celular esté en modo oscuro */
  :root {
    color-scheme: only light;
    --bg: #EBF5ED;
    --card: #FFFFFF;
    --g1: #2A5040;
    --g2: #45856A;
    --g3: #78B896;
    --g4: #C0DECA;
    --g5: #EAF5EE;
    --t1: #1C3A2C;
    --t2: #507260;
    --t3: #8AADA0;
    --gold: #C9A84C;
    --shadow: 0 6px 32px rgba(42,80,64,0.12);
    --shadow-lg: 0 12px 48px rgba(42,80,64,0.18);
    --r: 18px;
    --rsm: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
    color: var(--t1);
  }

  .wrap { max-width: 480px; margin: 0 auto; }

  /* ── Header ── */
  .header { text-align: center; margin-bottom: 32px; }
  .header-deco { font-size: 2.2rem; display: block; margin-bottom: 10px; }
  .header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 2rem; font-weight: normal;
    color: var(--g1); margin-bottom: 6px;
  }
  .header p { font-size: 0.85rem; color: var(--t3); letter-spacing: 0.02em; }

  /* ── Progress ── */
  .progress-wrap { margin-bottom: 16px; }
  .progress-label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
  }
  .progress-label span { font-size: 0.75rem; color: var(--t2); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
  .progress-label strong { font-size: 1.1rem; color: var(--g1); font-family: Georgia, serif; font-weight: normal; }
  .progress-bar { height: 6px; background: var(--g4); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--g2); border-radius: 3px; transition: width 0.8s cubic-bezier(0.34, 1.2, 0.64, 1); }

  /* ── Racha ── */
  .streak-row {
    display: flex; align-items: center; justify-content: flex-end;
    margin-bottom: 28px;
  }
  .streak-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--card); border: 1.5px solid var(--g4);
    border-radius: 50px; padding: 5px 14px;
    font-size: 0.78rem; color: var(--t2);
    box-shadow: 0 2px 8px rgba(42,80,64,0.08);
  }
  .streak-badge .fire { font-size: 1rem; }
  .streak-badge .streak-count {
    font-family: Georgia, serif; font-size: 1rem;
    color: var(--g1); font-weight: 600;
  }

  /* ── Daily card ── */
  .daily-section { margin-bottom: 32px; }

  .unlock-card {
    background: var(--card);
    border-radius: var(--r);
    padding: 36px 28px;
    box-shadow: var(--shadow-lg);
    text-align: center;
    border: 1.5px solid var(--g4);
  }

  .lock-icon { font-size: 2.8rem; display: block; margin-bottom: 14px; }

  .unlock-title {
    font-family: Georgia, serif; font-size: 1.4rem; font-weight: normal;
    color: var(--g1); margin-bottom: 8px;
  }
  .unlock-sub { font-size: 0.82rem; color: var(--t3); margin-bottom: 24px; line-height: 1.5; }

  .btn-unlock {
    width: 100%; background: var(--g2); color: #fff;
    border: none; border-radius: 50px; padding: 16px 24px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s, transform 0.12s;
    letter-spacing: 0.01em;
  }
  .btn-unlock:hover { background: var(--g1); }
  .btn-unlock:active { transform: scale(0.98); }

  /* ── Revealed moment ── */
  .moment-card {
    background: var(--card);
    border-radius: var(--r);
    padding: 32px 28px;
    box-shadow: var(--shadow-lg);
    border: 1.5px solid var(--g4);
    animation: revealCard 0.6s cubic-bezier(0.34, 1.4, 0.64, 1) both;
  }
  @keyframes revealCard {
    from { opacity: 0; transform: scale(0.9) translateY(16px); }
    to   { opacity: 1; transform: scale(1)   translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .moment-card { animation: none; } }

  .moment-num {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--g2); margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .moment-num::before, .moment-num::after {
    content: ''; flex: 1; height: 1px; background: var(--g4);
  }

  .moment-text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.15rem; line-height: 1.7;
    color: var(--t1); margin-bottom: 20px;
    text-wrap: balance;
  }

  .moment-date {
    font-size: 0.75rem; color: var(--t3);
    display: flex; align-items: center; gap: 6px;
  }

  /* ── Milestone celebration ── */
  .milestone-celebration {
    background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 100%);
    border-radius: var(--r);
    padding: 28px 24px;
    text-align: center;
    color: #fff;
    margin-bottom: 16px;
    box-shadow: var(--shadow-lg);
    animation: revealCard 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) both;
  }
  .milestone-celebration .ms-deco { font-size: 2.2rem; margin-bottom: 10px; }
  .milestone-celebration h3 {
    font-family: Georgia, serif; font-size: 1.3rem; font-weight: normal;
    margin-bottom: 6px;
  }
  .milestone-celebration p { font-size: 0.82rem; opacity: 0.85; line-height: 1.5; }

  /* ── Milestones section ── */
  .milestones-section { margin-bottom: 32px; }
  .milestones-title {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--t2); margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .milestones-title::after { content: ''; flex: 1; height: 1px; background: var(--g4); }

  .milestones-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }

  .milestone-card {
    background: var(--card);
    border-radius: var(--rsm);
    padding: 16px 14px;
    border: 1.5px solid var(--g4);
    box-shadow: 0 2px 10px rgba(42,80,64,0.07);
    position: relative; overflow: hidden;
    transition: border-color 0.2s;
  }
  .milestone-card.achieved {
    border-color: var(--g2);
    background: var(--g5);
  }
  .milestone-card.next-target {
    border-color: var(--g3);
  }

  .ms-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .ms-day {
    font-family: Georgia, serif; font-size: 1.5rem; color: var(--g1);
    line-height: 1;
  }
  .ms-label {
    font-size: 0.65rem; color: var(--t3); text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .ms-icon { font-size: 1.4rem; }

  .ms-progress-bar {
    height: 4px; background: var(--g4); border-radius: 2px;
    overflow: hidden; margin-bottom: 10px;
  }
  .ms-progress-fill {
    height: 100%; background: var(--g2); border-radius: 2px;
    transition: width 0.8s ease;
  }

  .ms-prize-label {
    font-size: 0.62rem; color: var(--t3); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 4px;
  }
  .ms-prize-text {
    font-family: Georgia, serif; font-size: 0.82rem; color: var(--t1);
    line-height: 1.4;
    filter: blur(5px);
    user-select: none;
    transition: filter 0.6s ease;
  }
  .ms-prize-text.revealed {
    filter: blur(0);
  }

  .ms-check {
    position: absolute; top: 10px; right: 10px;
    width: 20px; height: 20px; background: var(--g2);
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 0.7rem; color: #fff;
  }

  /* ── Countdown ── */
  .countdown-wrap {
    margin-top: 16px;
    background: var(--g5);
    border-radius: var(--rsm);
    padding: 14px 16px;
    text-align: center;
  }
  .countdown-label { font-size: 0.72rem; color: var(--t3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .countdown-time { font-family: Georgia, serif; font-size: 1.4rem; color: var(--g1); letter-spacing: 0.05em; font-variant-numeric: tabular-nums; }

  /* ── Archive ── */
  .archive-section { margin-bottom: 32px; }

  /* Cabecera plegable: el listado solo aparece al tocarla */
  .archive-toggle {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: var(--r);
    padding: 15px 18px; cursor: pointer;
    border: 1.5px solid var(--g4);
    box-shadow: 0 2px 10px rgba(42,80,64,0.07);
    user-select: none; -webkit-tap-highlight-color: transparent;
    transition: border-color 0.2s;
  }
  .archive-toggle:active { background: var(--g5); }
  .archive-toggle.open { border-color: var(--g3); }

  .at-icon {
    width: 36px; height: 36px; flex-shrink: 0;
    border-radius: 50%; background: var(--g5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem;
  }
  .at-text { flex: 1; min-width: 0; }
  .at-title {
    font-family: Georgia, serif; font-size: 0.98rem;
    color: var(--g1); line-height: 1.2;
  }
  .at-sub { font-size: 0.72rem; color: var(--t3); margin-top: 2px; }
  .at-chevron {
    font-size: 0.8rem; color: var(--t3); flex-shrink: 0;
    transition: transform 0.28s ease;
  }
  .archive-toggle.open .at-chevron { transform: rotate(180deg); }

  .archive-collapse { display: none; margin-top: 10px; }
  .archive-collapse.open {
    display: block;
    animation: slideDown 0.3s ease both;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .archive-empty { text-align: center; color: var(--t3); font-size: 0.85rem; padding: 24px; }

  .archive-grid { display: flex; flex-direction: column; gap: 6px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Acordeón ── */
  .archive-item {
    background: var(--card);
    border-radius: var(--rsm);
    border: 1.5px solid var(--g4);
    box-shadow: 0 2px 8px rgba(42,80,64,0.06);
    overflow: hidden;
    animation: fadeIn 0.3s ease both;
    transition: border-color 0.2s;
  }
  .archive-item.open { border-color: var(--g3); }

  .archive-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; cursor: pointer;
    gap: 10px; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .archive-header:active { background: var(--g5); }

  .archive-header-left {
    display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .archive-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--g3); flex-shrink: 0;
  }
  .archive-item.open .archive-dot { background: var(--g2); }

  .archive-header-info { min-width: 0; }
  .archive-num {
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--g2);
  }
  .archive-date-compact {
    font-size: 0.78rem; color: var(--t2); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  .archive-chevron {
    font-size: 0.75rem; color: var(--t3); flex-shrink: 0;
    transition: transform 0.25s ease;
  }
  .archive-item.open .archive-chevron { transform: rotate(180deg); }

  .archive-body {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .archive-item.open .archive-body { max-height: 2000px; }

  .archive-body-inner {
    padding: 0 16px 16px;
    border-top: 1px solid var(--g4);
    padding-top: 14px;
  }
  .archive-text {
    font-family: Georgia, serif; font-size: 0.92rem;
    line-height: 1.65; color: var(--t1);
  }

  /* ── Suggest box ── */
  .suggest-section { margin-top: 32px; }
  .suggest-card {
    background: var(--card); border-radius: var(--r);
    padding: 24px 28px; box-shadow: var(--shadow);
    border: 1.5px dashed var(--g4);
  }
  .suggest-title {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--t2); margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .suggest-title::after { content: ''; flex: 1; height: 1px; background: var(--g4); }
  .suggest-card textarea {
    width: 100%; border: 1.5px solid var(--g4); border-radius: var(--rsm);
    padding: 12px 14px; font-size: 0.9rem; font-family: Georgia, 'Times New Roman', serif;
    color: var(--t1); background: var(--g5); resize: vertical;
    min-height: 90px; line-height: 1.6; transition: border-color 0.15s;
  }
  .suggest-card textarea:focus { outline: none; border-color: var(--g2); }
  .suggest-card textarea::placeholder { color: var(--t3); font-style: italic; }
  .suggest-status {
    font-size: 0.8rem; text-align: center; padding: 8px; min-height: 28px;
    color: var(--g2); display: none; line-height: 1.5;
  }

  /* ── Respuestas a un momento ── */
  .reply-zone { margin-top: 16px; }

  .reply-open-btn {
    width: 100%; background: transparent; color: var(--g2);
    border: 1.5px dashed var(--g4); border-radius: var(--rsm);
    padding: 10px 14px; font-size: 0.8rem; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .reply-open-btn:hover { border-color: var(--g3); background: var(--g5); }

  .reply-form textarea {
    width: 100%; border: 1.5px solid var(--g4); border-radius: var(--rsm);
    padding: 11px 13px; font-size: 0.88rem;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--t1); background: var(--g5); resize: vertical;
    min-height: 76px; line-height: 1.6; transition: border-color 0.15s;
  }
  .reply-form textarea:focus { outline: none; border-color: var(--g2); }
  .reply-form textarea::placeholder { color: var(--t3); font-style: italic; }

  .reply-actions { display: flex; gap: 8px; margin-top: 9px; }
  .reply-actions button {
    flex: 1; border-radius: 50px; padding: 10px 14px;
    font-size: 0.82rem; font-weight: 600; font-family: inherit;
    cursor: pointer; border: none;
    transition: background 0.2s, transform 0.12s;
  }
  .reply-actions button:active { transform: scale(0.98); }
  .reply-send   { background: var(--g2); color: #fff; }
  .reply-send:hover { background: var(--g1); }
  .reply-cancel { background: var(--g5); color: var(--t2); border: 1.5px solid var(--g4) !important; }

  .reply-status {
    font-size: 0.78rem; color: var(--g2); text-align: center;
    margin-top: 7px; display: none;
  }

  .reply-saved {
    background: var(--g5); border-radius: var(--rsm);
    border-left: 3px solid var(--g3);
    padding: 12px 14px;
    animation: fadeIn 0.35s ease both;
  }
  .reply-saved-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 6px;
  }
  .reply-saved-tag {
    font-size: 0.64rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--g2);
  }
  .reply-edit {
    background: none; border: none; cursor: pointer; padding: 0;
    font-family: inherit; font-size: 0.72rem; color: var(--t3);
    text-decoration: underline;
  }
  .reply-saved-text {
    font-family: Georgia, serif; font-size: 0.88rem;
    line-height: 1.6; color: var(--t1); white-space: pre-wrap;
  }
  .reply-saved-date { font-size: 0.68rem; color: var(--t3); margin-top: 7px; }

  /* ── Bonus de racha ── */
  .bonus-box {
    margin-top: 16px; padding: 15px 16px;
    border-radius: 15px;
    background: linear-gradient(145deg, var(--g5) 0%, #FFFFFF 130%);
    border: 1px solid var(--g4);
    position: relative; overflow: hidden;
  }
  .bonus-box::before {
    content: ''; position: absolute; bottom: -42px; right: -28px;
    width: 96px; height: 96px; border-radius: 50%;
    background: var(--g4); opacity: 0.22;
  }
  .bonus-box.agotado { opacity: 0.6; }
  .bonus-box.agotado::before { display: none; }

  .bonus-head {
    display: flex; align-items: center; gap: 11px;
    margin-bottom: 10px; position: relative;
  }
  .bonus-icon {
    width: 34px; height: 34px; flex-shrink: 0;
    border-radius: 50%; background: var(--card);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem;
    box-shadow: 0 2px 8px rgba(42,80,64,0.12);
  }
  .bonus-headtext { flex: 1; min-width: 0; }
  .bonus-tag {
    font-size: 0.78rem; font-weight: 600; color: var(--g1);
    font-family: Georgia, serif; letter-spacing: 0.01em;
  }
  .bonus-hearts { display: flex; gap: 5px; flex-shrink: 0; }
  .bonus-heart {
    font-size: 1.05rem; line-height: 1;
    color: var(--g2);
    transition: color 0.35s ease, transform 0.35s ease;
  }
  .bonus-heart.gastado {
    color: var(--g4);
    transform: scale(0.85);
  }

  .bonus-desc {
    font-size: 0.78rem; color: var(--t2); line-height: 1.5;
    position: relative;
  }

  /* ── Finale ── */
  .finale-card {
    background: var(--g1); color: #fff;
    border-radius: var(--r); padding: 40px 28px; text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .finale-card h2 { font-family: Georgia, serif; font-size: 1.6rem; font-weight: normal; margin-bottom: 12px; }
  .finale-card p { font-size: 0.9rem; line-height: 1.6; opacity: 0.85; }
</style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <span class="header-deco">🌿</span>
    <h1>100 Momentos</h1>
    <p>un recuerdo nuestro, cada día</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Descubiertos</span>
      <strong id="progressText">0 de 100</strong>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="streak-row">
    <div class="streak-badge" id="streakBadge" style="display:none">
      <span class="fire">🔥</span>
      <span class="streak-count" id="streakCount">0</span>
      <span>días seguidos</span>
    </div>
  </div>

  <div class="daily-section" id="dailySection"></div>

  <div class="milestones-section" id="milestonesSection"></div>

  <div class="archive-section">
    <div class="archive-toggle" id="archiveToggle" onclick="toggleArchiveList()">
      <span class="at-icon">📖</span>
      <div class="at-text">
        <div class="at-title">Momentos descubiertos</div>
        <div class="at-sub" id="archiveCount"></div>
      </div>
      <span class="at-chevron">▼</span>
    </div>
    <div class="archive-collapse" id="archiveCollapse">
      <div id="archiveGrid"></div>
    </div>
  </div>

  <!-- Formulario oculto para que Netlify lo detecte en el build -->
  <form name="sugerencias" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="sugerencias" />
    <input type="text" name="bot-field" />
    <input type="text" name="sugerencia" />
  </form>

  <!-- Formulario oculto: racha diaria (invisible para Alyn, visible en Netlify Forms) -->
  <form name="racha-diaria" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="racha-diaria" />
    <input type="text" name="bot-field" />
    <input type="text" name="racha" />
    <input type="text" name="momento" />
    <input type="text" name="fecha" />
  </form>

  <!-- Formulario oculto: sus respuestas a los momentos -->
  <form name="respuestas" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="respuestas" />
    <input type="text" name="bot-field" />
    <input type="text" name="respuesta" />
    <input type="text" name="momento" />
    <input type="text" name="recuerdo" />
    <input type="text" name="fecha" />
  </form>

  <div class="suggest-section">
    <div class="suggest-card">
      <div class="suggest-title">💌 Sugiere un momento</div>
      <textarea id="suggestText" placeholder="¿Hay un recuerdo que quieras sumar? Escríbelo acá…"></textarea>

      <div class="bonus-box" id="bonusBox">
        <div class="bonus-head">
          <span class="bonus-icon">🍀</span>
          <div class="bonus-headtext">
            <div class="bonus-tag">Bonus de racha</div>
          </div>
          <div class="bonus-hearts" id="bonusHearts"></div>
        </div>
        <p class="bonus-desc" id="bonusDesc"></p>
      </div>

      <div class="suggest-status" id="suggestStatus"></div>

//  HITOS DE RACHA — edita los premios aquí cuando los tengas definidos
// ══════════════════════════════════════════════════════════════════════
const MILESTONES = [
  { day: 10,  emoji: '✨', title: '10 días',  prize: 'Café &amp; Pastel en Media Luna, Valparaíso' },
  { day: 25,  emoji: '🌸', title: '25 días',  prize: 'Un masaje' },

];

const EMAILJS_PUBLIC_KEY  = 'JXALjvHACKd5EL19V';

// ── Helpers de fecha ──────────────────────────────────────────────────
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function yesterday() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(iso) {
  const [y,m,d] = iso.split('-');
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${parseInt(d)} de ${meses[parseInt(m)-1]} de ${y}`;
}

// Devuelve la fecha ISO desplazada N días
function shiftDate(iso, delta) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

// Días en que entró pero ya no quedaban momentos nuevos por descubrir.
// No suman a la racha, pero tampoco la cortan: no fue culpa suya.
// Aquí también caen los días que el bonus perdona (ver aplicarBonusRacha).
function getDroughtDays() {
  try { return new Set(JSON.parse(localStorage.getItem('momentos_diasSinStock') || '[]')); }
  catch (e) { return new Set(); }
}

// ══════════════════════════════════════════════════════════════════════
//  BONUS: enviar un momento recupera la racha completa. Máximo 3 veces.
// ══════════════════════════════════════════════════════════════════════
const BONUS_MAX = 3;

function getBonusUsados() {
  return parseInt(localStorage.getItem('momentos_bonusUsados') || '0');
}

function getBonusRestantes() {
  return Math.max(0, BONUS_MAX - getBonusUsados());
}

// Racha que le correspondería si no se le hubiera cortado nunca:
// un día por cada momento que ya descubrió.
function rachaPotencial(seenDates) {
  return new Set(Object.values(seenDates).filter(Boolean)).size;
}

// Perdona todos los huecos entre su primera apertura y hoy, de modo que
// la racha vuelva a contar todos sus días. Devuelve la racha resultante,
// o null si no quedan bonus o si no hay nada que recuperar.
function aplicarBonusRacha() {
  if (getBonusRestantes() === 0) return null;

  const seenDates = JSON.parse(localStorage.getItem('momentos_seenDates') || '{}');
  const abiertos  = new Set(Object.values(seenDates).filter(Boolean));
  if (abiertos.size === 0) return null;

  const potencial = rachaPotencial(seenDates);
  if (computeStreak(seenDates) >= potencial) return null;  // no gastar el bonus en vano

  const puente = getDroughtDays();
  const desde  = [...abiertos].sort()[0];
  for (let cursor = desde; cursor <= today(); cursor = shiftDate(cursor, 1)) {
    if (!abiertos.has(cursor)) puente.add(cursor);
  }
  localStorage.setItem('momentos_diasSinStock', JSON.stringify([...puente]));
  localStorage.setItem('momentos_bonusUsados', String(getBonusUsados() + 1));

  syncStreak();
  return parseInt(localStorage.getItem('momentos_streak'));
}

// ── Racha calculada desde las fechas reales de apertura ───────────────
// Fuente de verdad: seenDates guarda el día exacto de cada momento abierto.
// Así la racha se autocorrige y no depende de contadores acumulados.
function computeStreak(seenDates) {
  const abiertos = new Set(Object.values(seenDates).filter(Boolean));
  if (abiertos.size === 0) return 0;
  const sinStock = getDroughtDays();
  const cuenta   = (d) => abiertos.has(d) || sinStock.has(d);

  // Sigue viva si hoy o ayer abrió un momento, o si no había nada que abrir
  let cursor = today();
  if (!cuenta(cursor)) {
    cursor = yesterday();
    if (!cuenta(cursor)) return 0;
  }

  let racha = 0;
  while (cuenta(cursor)) {
    if (abiertos.has(cursor)) racha++;   // solo suman los días que sí abrió
    cursor = shiftDate(cursor, -1);
  }
  return racha;
}

// Mejor racha alcanzada alguna vez — define qué premios ya se ganó.
// Se recalcula desde las fechas, así los hitos se recuperan solos.
function maxStreakEver(seenDates) {
  const dias = [...new Set(Object.values(seenDates).filter(Boolean))].sort();
  if (dias.length === 0) return 0;
  let mejor = 1, actual = 1;
  for (let i = 1; i < dias.length; i++) {
    actual = (dias[i] === shiftDate(dias[i-1], 1)) ? actual + 1 : 1;
    if (actual > mejor) mejor = actual;
  }
  return mejor;
}

// Hitos ya desbloqueados. Una vez ganado, un premio no se vuelve a bloquear.
function getAchieved() {
  return JSON.parse(localStorage.getItem('momentos_msAchieved') || '[]');
}

function syncAchieved(seenDates, rachaActual) {
  const mejor    = Math.max(maxStreakEver(seenDates), rachaActual || 0);
  const achieved = getAchieved();
  MILESTONES.forEach(ms => {
    if (mejor >= ms.day && !achieved.includes(ms.day)) achieved.push(ms.day);
  });
  localStorage.setItem('momentos_msAchieved', JSON.stringify(achieved));
  return achieved;
}

// ── localStorage ──────────────────────────────────────────────────────
function getState() {
  return {
    seen:          JSON.parse(localStorage.getItem('momentos_seen')          || '[]'),
    seenDates:     JSON.parse(localStorage.getItem('momentos_seenDates')     || '{}'),
    lastDate:      localStorage.getItem('momentos_lastDate')  || '',
    todayIdx:      localStorage.getItem('momentos_todayIdx') !== null
                   ? parseInt(localStorage.getItem('momentos_todayIdx'))
                   : null,
    streak:        parseInt(localStorage.getItem('momentos_streak')          || '0'),
    streakDate:    localStorage.getItem('momentos_streakDate')               || '',
    notifiedMs:    JSON.parse(localStorage.getItem('momentos_notifiedMs')    || '[]'),
  };
}

function saveState(st) {
  localStorage.setItem('momentos_seen',       JSON.stringify(st.seen));
  localStorage.setItem('momentos_seenDates',  JSON.stringify(st.seenDates));
  localStorage.setItem('momentos_lastDate',   st.lastDate);
  if (st.todayIdx !== null) localStorage.setItem('momentos_todayIdx', st.todayIdx);
  localStorage.setItem('momentos_streak',     st.streak);
  localStorage.setItem('momentos_streakDate', st.streakDate);
  localStorage.setItem('momentos_notifiedMs', JSON.stringify(st.notifiedMs));
}

// ══════════════════════════════════════════════════════════════════════
//  SIEMBRA — el progreso no se pierde al cambiar de navegador
//
//  Lo que ella descubre vive en el navegador donde lo abrió. Si entra
//  desde otro (Safari en vez de Chrome, o la app de pantalla de inicio,
//  que en iOS guarda aparte), arrancaría de cero. Esto le devuelve lo
//  que ya tenía.
//
//  Solo agrega lo que falte: nunca borra ni pisa lo que ya esté guardado.
// ══════════════════════════════════════════════════════════════════════
function rango(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }

const YA_DESCUBIERTOS  = [...rango(1, 32), 36, 38];  // números tal como salen en el admin
const RACHA_AL_MIGRAR  = 7;                          // ← ajústalo a la racha que ella trae
const PREMIOS_GANADOS  = [10, 25];                   // hitos que ya se ganó

function sembrar() {
  const seen      = JSON.parse(localStorage.getItem('momentos_seen')      || '[]');
  const seenDates = JSON.parse(localStorage.getItem('momentos_seenDates') || '{}');

  const faltan = YA_DESCUBIERTOS
    .map(n => n - 1)
    .filter(i => MOMENTOS[i] != null && !seen.includes(i));

  if (faltan.length) {
    // Los últimos van en días seguidos hasta ayer, para conservar la racha.
    // Los anteriores quedan más atrás, con un hueco, para no inflarla.
    const racha  = Math.min(RACHA_AL_MIGRAR, faltan.length);
    const recientes = faltan.slice(faltan.length - racha);
    const viejos    = faltan.slice(0, faltan.length - racha);

    recientes.forEach((idx, k) => {
      seen.push(idx);
      seenDates[idx] = shiftDate(today(), -(racha - k));
    });

    const finViejos = racha + 3;   // el hueco corta la racha donde corresponde
    viejos.forEach((idx, k) => {
      seen.push(idx);
      seenDates[idx] = shiftDate(today(), -(finViejos + (viejos.length - 1 - k)));
    });

    // Orden por número de momento, para que el archivo quede coherente
    seen.sort((a, b) => a - b);

    localStorage.setItem('momentos_seen',      JSON.stringify(seen));
    localStorage.setItem('momentos_seenDates', JSON.stringify(seenDates));

    // Que pueda abrir uno hoy: se marca el último día, no el de hoy
    const dias = Object.values(seenDates).filter(Boolean).sort();
    localStorage.setItem('momentos_lastDate', dias[dias.length - 1]);
    localStorage.removeItem('momentos_todayIdx');
  }

  // Premios ganados, que también viven por navegador
  const ganados = JSON.parse(localStorage.getItem('momentos_msAchieved') || '[]');
  let sumo = false;
  PREMIOS_GANADOS.forEach(d => { if (!ganados.includes(d)) { ganados.push(d); sumo = true; } });
  if (sumo) localStorage.setItem('momentos_msAchieved', JSON.stringify(ganados));
}

// ── Sincronizar la racha con las fechas reales ───────────────────────
// Corre en cada carga: recalcula desde seenDates y repara cualquier
// desfase heredado de las versiones anteriores del contador.
function syncStreak() {
  const seenDates = JSON.parse(localStorage.getItem('momentos_seenDates') || '{}');
  const seen      = JSON.parse(localStorage.getItem('momentos_seen')      || '[]');
  const dias      = Object.values(seenDates).filter(Boolean).sort();

  // Si ya descubrió todo lo escrito, hoy no hay nada que abrir: se registra
  // como día sin stock para que la racha se congele en vez de romperse.
  if (dias.length && getAvailable(seen).length === 0) {
    const sinStock = JSON.parse(localStorage.getItem('momentos_diasSinStock') || '[]');
    if (!sinStock.includes(today())) {
      sinStock.push(today());
      localStorage.setItem('momentos_diasSinStock', JSON.stringify(sinStock));
    }
  }

  const racha = computeStreak(seenDates);

  localStorage.setItem('momentos_streak',     String(racha));
  localStorage.setItem('momentos_streakDate', dias.length ? dias[dias.length - 1] : '');

  // Premios ya ganados quedan desbloqueados para siempre
  syncAchieved(seenDates, racha);

  // Claves de las migraciones antiguas, ya no se usan
  localStorage.removeItem('momentos_baseConsumed');
  localStorage.removeItem('momentos_streakInit');
  localStorage.removeItem('momentos_streakInit_v2');
}

// ── Pool de momentos disponibles ──────────────────────────────────────
function getAvailable(seen) {
  return MOMENTOS
    .map((m, i) => ({ m, i }))
    .filter(x => x.m !== null && !seen.includes(x.i));
}

// ── Render principal ──────────────────────────────────────────────────
function render() {

function renderDaily(st, total) {
  const section   = document.getElementById('dailySection');
  const available = getAvailable(st.seen);
  const alreadyOpenedToday = st.lastDate === today() && st.todayIdx !== null;

  // Todos descubiertos
  if (available.length === 0 && st.seen.length >= total && total > 0) {
    section.innerHTML = `
      <div class="finale-card">
        <div style="font-size:2.5rem;margin-bottom:16px">🌿</div>
        <h2>Los 100 momentos, descubiertos</h2>
        <p>Gracias por haber vivido cada uno de estos momentos conmigo.<br>Ojalá sigamos llenando más páginas juntos.</p>
      </div>`;
    return;
  }

  // Sin momentos disponibles aún
  if (available.length === 0) {
    section.innerHTML = `<div class="unlock-card"><span class="lock-icon">🌱</span><p class="unlock-sub">Pronto habrá más momentos para descubrir.</p></div>`;
    return;
  }

  if (alreadyOpenedToday) {
    const texto = MOMENTOS[st.todayIdx];
    const fecha = formatDate(st.seenDates[st.todayIdx] || today());
    const num   = st.seen.indexOf(st.todayIdx) + 1;

    // Celebración de hito
    const hitMs = MILESTONES.find(m => m.day === st.streak);
    const celHtml = hitMs ? `
      <div class="milestone-celebration">

    section.innerHTML = `
      ${celHtml}

      </div>
      <div class="countdown-wrap">
        <div class="countdown-label">Próximo momento en</div>
        <div class="countdown-time" id="countdown">--:--:--</div>
      </div>`;
    startCountdown();
  } else {
    section.innerHTML = `
      <div class="unlock-card">
        <span class="lock-icon">🎁</span>
        <h2 class="unlock-title">Tu momento de hoy</h2>
        <p class="unlock-sub">Hay un recuerdo especial esperándote.<br>Solo puedes abrir uno por día.</p>
        <button class="btn-unlock" onclick="unlockMomento()">
          Descubrir momento de hoy 🌿
        </button>
      </div>`;
  }
}

function renderMilestones(st) {
  const section  = document.getElementById('milestonesSection');
  // Un premio ganado queda desbloqueado aunque después se corte la racha
  const unlocked = getAchieved();
  const pending  = MILESTONES.find(m => !unlocked.includes(m.day));
  section.innerHTML = `
    <div class="milestones-title">🏅 Hitos de racha</div>
    <div class="milestones-grid">
      ${MILESTONES.map(ms => {
        const achieved  = unlocked.includes(ms.day);
        const isNext    = !achieved && pending === ms;
        const progress  = achieved ? 100 : Math.min(100, Math.round((st.streak / ms.day) * 100));
        const cardClass = achieved ? 'milestone-card achieved' : isNext ? 'milestone-card next-target' : 'milestone-card';
        return `
          <div class="${cardClass}">
            ${achieved ? '<div class="ms-check">✓</div>' : ''}
            <div class="ms-header">
              <div>
                <div class="ms-day">${ms.day}</div>
                <div class="ms-label">días seguidos</div>
              </div>
              <div class="ms-icon">${ms.emoji}</div>
            </div>
            <div class="ms-progress-bar">
              <div class="ms-progress-fill" style="width:${progress}%"></div>
            </div>
            <div class="ms-prize-label">Premio</div>
            <div class="ms-prize-text ${achieved ? 'revealed' : ''}">${ms.prize}</div>
          </div>`;
      }).join('')}
    </div>`;
}

function renderArchive(st) {
  const grid = document.getElementById('archiveGrid');
  const past = st.seen.filter(i => i !== (st.todayIdx ?? -1));

  // Resumen en la cabecera plegable
  document.getElementById('archiveCount').textContent =
    past.length === 0
      ? 'Todavía no hay ninguno guardado'
      : `${past.length} ${past.length === 1 ? 'recuerdo guardado' : 'recuerdos guardados'} · tócalo para verlos`;

  if (past.length === 0) {
    grid.innerHTML = `<div class="archive-empty">Los momentos que descubras aparecerán aquí ✨</div>`;
    return;
  }

  grid.innerHTML = [...past].reverse().map((i, idx) => {
    const fecha = formatDate(st.seenDates[i] || '');
    const num   = st.seen.indexOf(i) + 1;
    const id    = `arc-${i}`;
    return `
      <div class="archive-item" id="${id}">
        <div class="archive-header" onclick="toggleArchive('${id}')">
          <div class="archive-header-left">
            <div class="archive-dot"></div>
            <div class="archive-header-info">

              <div class="archive-date-compact">${fecha}</div>
            </div>
          </div>
          <span class="archive-chevron">▼</span>
        </div>
        <div class="archive-body">
          <div class="archive-body-inner">
            <div class="archive-text">${MOMENTOS[i]}</div>
            <div class="reply-zone" id="replyZone-${i}">${replyZoneHtml(i)}</div>
          </div>

// Muestra u oculta el listado completo de momentos descubiertos
function toggleArchiveList() {
  const abierto = document.getElementById('archiveCollapse').classList.toggle('open');
  document.getElementById('archiveToggle').classList.toggle('open', abierto);
  // Al cerrar, también se cierra cualquier momento que estuviera desplegado
  if (!abierto) {
    document.querySelectorAll('.archive-item.open').forEach(e => e.classList.remove('open'));
  }
}

function toggleArchive(id) {
  const el = document.getElementById(id);
  const isOpen = el.classList.contains('open');
  // Cerrar todos
  document.querySelectorAll('.archive-item.open').forEach(e => e.classList.remove('open'));
  // Abrir el tocado (si estaba cerrado)
  if (!isOpen) el.classList.add('open');
}

// ── Desbloquear ───────────────────────────────────────────────────────
function unlockMomento() {
  const st        = getState();
  const available = getAvailable(st.seen);
  if (available.length === 0) return;

  const pick = available[Math.floor(Math.random() * available.length)];
  st.seen.push(pick.i);
  st.seenDates[pick.i] = today();
  st.lastDate  = today();
  st.todayIdx  = pick.i;

  // Racha recalculada desde las fechas reales de apertura
  st.streak     = computeStreak(st.seenDates);
  st.streakDate = today();

  saveState(st);

  // Desbloquear los premios que correspondan (quedan desbloqueados para siempre)
  syncAchieved(st.seenDates, st.streak);

  // Registro silencioso de racha en Netlify Forms
  const momentNum = st.seen.length;
  logStreakToNetlify(st.streak, momentNum);

  // Notificar hito si aplica
  const hitMs = MILESTONES.find(ms => ms.day === st.streak && !st.notifiedMs.includes(ms.day));
  if (hitMs) {
    st.notifiedMs.push(hitMs.day);
    saveState(st);
    notifyMilestone(hitMs, st.streak);
  }

  render();
}

// ── Registro diario de racha en Netlify Forms (silencioso) ───────────
function logStreakToNetlify(streak, momentNum) {
  fetch('/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      'form-name': 'racha-diaria',
      racha:   `${streak} día${streak !== 1 ? 's' : ''}`,
      momento: `Momento ${momentNum}`,
      fecha:   formatDate(today()),
    }).toString()
  }).catch(() => {}); // silencioso si falla
}

// ── Notificar a Matías al alcanzar un hito ────────────────────────────
function notifyMilestone(ms, streak) {
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_email:   EMAIL_MATIAS,
    to_name:    'Matías',
    plan_name:  `Racha de ${ms.day} días en 100 Momentos`,
    date:       formatDate(today()),
    time:       '',
    message:    `¡Alyn alcanzó ${streak} días seguidos descubriendo momentos! 🎉 Ha desbloqueado el hito de ${ms.title}.`
  }).catch(() => {}); // silencioso si falla
}

// ── Countdown hasta medianoche ────────────────────────────────────────
let countdownTimer = null;

function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  function update() {
    const el = document.getElementById('countdown');
    if (!el) { clearInterval(countdownTimer); return; }
    const now  = new Date();
    const next = new Date(now); next.setHours(24,0,0,0);
    const diff = next - now;
    const h = String(Math.floor(diff / 3600000)).padStart(2,'0');
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
    el.textContent = `${h}:${m}:${s}`;
  }
  update();
  countdownTimer = setInterval(update, 1000);
}

// ── Sugerencias (Netlify Forms) ───────────────────────────────────────
async function sendSuggestion() {
  const texto = document.getElementById('suggestText').value.trim();
  if (!texto) return;
  const status = document.getElementById('suggestStatus');
  status.style.display = 'block';
  status.textContent = '📨 Guardando…';
  try {
    await fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ 'form-name': 'sugerencias', sugerencia: texto }).toString()
    });
    document.getElementById('suggestText').value = '';

    // Bonus: el momento enviado recupera la racha (máximo 3 veces)
    const recuperada = aplicarBonusRacha();
    if (recuperada !== null) {
      status.innerHTML = `✅ ¡Momento enviado!<br>🔥 Recuperaste tu racha de ${recuperada} días`;
      render();
      renderBonusInfo();
      setTimeout(() => { status.style.display = 'none'; }, 6000);
    } else {
      status.textContent = '✅ ¡Momento enviado!';
      setTimeout(() => { status.style.display = 'none'; }, 3000);
    }
  } catch(err) {
    status.textContent = '❌ No se pudo guardar. Intentá de nuevo.';
  }
}

// ══════════════════════════════════════════════════════════════════════
//  RESPUESTAS — ella puede contestar cualquier momento ya descubierto
// ══════════════════════════════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function getRespuestas() {
  try { return JSON.parse(localStorage.getItem('momentos_respuestas') || '{}'); }
  catch (e) { return {}; }
}

// Bloque de respuesta para un momento: su texto guardado, o la invitación a escribir
function replyZoneHtml(idx) {
  const guardada = getRespuestas()[idx];
  const cabecera = guardada
    ? `<div class="reply-saved" id="replySaved-${idx}">
         <div class="reply-saved-head">
           <span class="reply-saved-tag">💬 Tu respuesta</span>
           <button class="reply-edit" onclick="openReplyForm(${idx})">editar</button>
         </div>
         <p class="reply-saved-text">${esc(guardada.texto)}</p>
         <div class="reply-saved-date">${esc(guardada.fecha)}</div>
       </div>`
    : `<button class="reply-open-btn" id="replyOpen-${idx}" onclick="openReplyForm(${idx})">
         💬 Responder este momento
       </button>`;

  return `
    ${cabecera}
    <div class="reply-form" id="replyForm-${idx}" hidden>
      <textarea id="replyText-${idx}" placeholder="¿Qué recuerdas tú de ese día?">${guardada ? esc(guardada.texto) : ''}</textarea>
      <div class="reply-actions">
        <button class="reply-cancel" onclick="closeReplyForm(${idx})">Cancelar</button>
        <button class="reply-send" onclick="sendReply(${idx})">Enviar 💚</button>
      </div>
      <div class="reply-status" id="replyStatus-${idx}"></div>
    </div>`;
}

function openReplyForm(idx) {
  const saved = document.getElementById(`replySaved-${idx}`);
  const open  = document.getElementById(`replyOpen-${idx}`);
  if (saved) saved.hidden = true;
  if (open)  open.hidden  = true;
  document.getElementById(`replyForm-${idx}`).hidden = false;
  document.getElementById(`replyText-${idx}`).focus();
}

function closeReplyForm(idx) {
  document.getElementById(`replyForm-${idx}`).hidden = true;
  const saved = document.getElementById(`replySaved-${idx}`);
  const open  = document.getElementById(`replyOpen-${idx}`);
  if (saved) saved.hidden = false;
  if (open)  open.hidden  = false;
}

async function sendReply(idx) {
  const texto = document.getElementById(`replyText-${idx}`).value.trim();
  if (!texto) return;

  const status = document.getElementById(`replyStatus-${idx}`);
  status.style.display = 'block';
  status.textContent = '📨 Enviando…';

  try {
    await fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        'form-name': 'respuestas',
        respuesta: texto,
        momento:   `Momento ${idx + 1}`,
        recuerdo:  MOMENTOS[idx] || '',
        fecha:     formatDate(today()),
      }).toString()
    });

    const todas = getRespuestas();
    todas[idx] = { texto: texto, fecha: formatDate(today()) };
    localStorage.setItem('momentos_respuestas', JSON.stringify(todas));

    // Redibujar solo este bloque, para no cerrar el momento abierto
    document.getElementById(`replyZone-${idx}`).innerHTML = replyZoneHtml(idx);
  } catch (err) {
    status.textContent = '❌ No se pudo enviar. Intentá de nuevo.';
  }
}

// ── Aviso del bonus ───────────────────────────────────────────────────
function renderBonusInfo() {
  const usados = getBonusUsados();

  document.getElementById('bonusBox').classList.toggle('agotado', getBonusRestantes() === 0);
  document.getElementById('bonusDesc').textContent =
    `Envía un momento y recupera tu racha (máximo ${BONUS_MAX} veces)`;

  // Los usos disponibles se muestran como corazones que se van gastando
  document.getElementById('bonusHearts').innerHTML =
    Array.from({ length: BONUS_MAX }, (_, i) =>
      `<span class="bonus-heart ${i < usados ? 'gastado' : ''}">♥</span>`
    ).join('');
}

// ── Init ──────────────────────────────────────────────────────────────
sembrar();
syncStreak();
render();
renderBonusInfo();
</script>
